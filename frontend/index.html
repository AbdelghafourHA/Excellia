<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Primary Meta Tags -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title Tag - Keep it under 60 characters -->
    <title>EMINORA Montessori Kindergarten | Register & Learn More</title>

    <!-- Meta Description - Keep it under 160 characters -->
    <meta
      name="description"
      content="EMINORA Montessori Kindergarten - A nurturing educational environment for children. Register now and explore our unique Montessori program."
    />

    <!-- Keywords (optional but helpful) -->
    <meta
      name="keywords"
      content="Montessori kindergarten, children education, EMINORA, preschool, early childhood education, Montessori method"
    />

    <!-- Robots Meta Tag -->
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL - Updated with correct domain -->
    <link rel="canonical" href="https://eminora-montessori.com/" />

    <!-- Open Graph Meta Tags for Social Media -->
    <meta property="og:title" content="EMINORA Montessori Kindergarten" />
    <meta
      property="og:description"
      content="Discover our unique Montessori program for children. Register today!"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://eminora-montessori.com/" />
    <meta
      property="og:image"
      content="https://eminora-montessori.com/logo.svg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="EMINORA Montessori" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EMINORA Montessori Kindergarten" />
    <meta
      name="twitter:description"
      content="Discover our unique Montessori program for children. Register today!"
    />
    <meta
      name="twitter:image"
      content="https://eminora-montessori.com/logo.svg"
    />

    <!-- Favicon and Icons -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />

    <!-- Language Alternates (if you have multiple languages) -->
    <link
      rel="alternate"
      hreflang="en"
      href="https://eminora-montessori.com/"
    />

    <!-- Structured Data / Schema Markup (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "EMINORA Montessori Kindergarten",
        "description": "A Montessori-based educational program for children focusing on holistic development.",
        "url": "https://eminora-montessori.com/",
        "logo": "https://eminora-montessori.com/logo.svg",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Your City",
          "addressRegion": "Your Region",
          "addressCountry": "Your Country"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "Registration",
          "telephone": "+1234567890",
          "email": "info@eminora-montessori.com"
        },
        "offers": {
          "@type": "Offer",
          "description": "Montessori education program registration",
          "availability": "https://schema.org/InStock"
        },
        "sameAs": [
          "https://facebook.com/eminoramontessori",
          "https://instagram.com/eminoramontessori"
        ]
      }
    </script>

    <!-- Organization Schema (Additional for better visibility) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "EMINORA Montessori",
        "url": "https://eminora-montessori.com/",
        "logo": "https://eminora-montessori.com/logo.svg",
        "description": "Montessori kindergarten providing quality early childhood education.",
        "email": "info@eminora-montessori.com"
      }
    </script>

    <!-- Sitemap Reference -->
    <link
      rel="sitemap"
      type="application/xml"
      title="Sitemap"
      href="/sitemap.xml"
    />

    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- DNS Prefetch for external resources -->
    <link rel="dns-prefetch" href="//fonts.googleapis.com" />
    <link rel="dns-prefetch" href="//fonts.gstatic.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
